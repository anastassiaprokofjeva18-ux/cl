<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jelena Heart</title>
<style>
    body {
        margin: 0;
        background: #060208;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// Фразы вокруг сердца
const PHRASES = [
    "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
    "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
    "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
    "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
    "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю",
];

// Формула сердца
function heart(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y =
        13 * Math.cos(t) -
        5 * Math.cos(2*t) -
        2 * Math.cos(3*t) -
        Math.cos(4*t);
    return {x, y};
}

// Фразы вокруг сердца
let floatingTexts = [];
for (let i = 0; i < PHRASES.length; i++) {
    floatingTexts.push({
        text: PHRASES[i],
        angle: Math.random() * Math.PI * 2,
        radius: 200 + Math.random() * 80,
        speed: 0.005 + Math.random() * 0.01,
        flash: 0
    });
}

let time = 0;

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const scale = 20;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2; // центрируем сердце

    // Рисуем сердце
    ctx.beginPath();
    for (let i = 0; i < 720; i++) {
        const t = i * Math.PI * 2 / 720;
        const p = heart(t);
        const x = cx + p.x * scale;
        const y = cy - p.y * scale;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.closePath();

    const glow = Math.sin(time * 0.03) * 0.3 + 0.7;
    ctx.fillStyle = `rgba(255, 50, 90, ${glow})`;
    ctx.shadowColor = "rgba(255, 0, 80, 0.8)";
    ctx.shadowBlur = 40;
    ctx.fill();

    // Текст Claudio ровно в центре сердца
    ctx.shadowBlur = 0;
    ctx.fillStyle = "white";
    ctx.font = "bold 48px Arial";
    ctx.textAlign = "center";
    ctx.fillText("Jelena", cx, cy);

    // Анимация фраз вокруг сердца
    ctx.font = "bold 22px Arial";
    for (let obj of floatingTexts) {
        obj.angle += obj.speed;
        obj.flash = Math.abs(Math.sin(time * 0.02 + obj.angle));

        const x = cx + Math.cos(obj.angle) * obj.radius;
        const y = cy + Math.sin(obj.angle) * obj.radius;

        ctx.fillStyle = `rgba(255,255,255,${0.4 + obj.flash * 0.6})`;
        ctx.fillText(obj.text, x, y);
    }

    time++;
    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
